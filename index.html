<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بطل في الرياضيات - إصدار متجر بلاي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

  :root {
    --play-green: #01875F;
    --play-green-dark: #016848;
    --play-green-light: #E6F4EA;
    --play-blue: #0B57D0;
    --play-blue-light: #E8F0FE;
    --play-gold: #F59E0B;
    --play-gold-light: #FEF3C7;
    --play-red: #D93025;
    --play-red-light: #FCE8E6;
    --bg-main: #F8F9FA;
    --surface: #FFFFFF;
    --surface-variant: #F1F3F4;
    --border-color: #DADCE0;
    --text-primary: #202124;
    --text-secondary: #5F6368;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-pill: 999px;
    --shadow-sm: 0 1px 3px rgba(60,64,67,0.08), 0 1px 2px rgba(60,64,67,0.06);
    --shadow-md: 0 4px 12px rgba(60,64,67,0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Cairo', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Google Play Top Header */
  .play-header {
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border-color);
    padding: 10px 16px 8px;
    box-shadow: var(--shadow-sm);
  }

  .header-top-row {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .app-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .play-logo-box {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--play-green), #00B4D8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 900;
    font-size: 20px;
    box-shadow: 0 2px 6px rgba(1, 135, 95, 0.25);
  }

  .brand-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .brand-subtitle {
    font-size: 11px;
    color: var(--play-green);
    font-weight: 700;
  }

  .stats-pills {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 800;
    border: 1px solid var(--border-color);
    background: var(--surface-variant);
  }

  .stat-pill.hearts { background: var(--play-red-light); color: var(--play-red); border-color: #F6AEA9; }
  .stat-pill.points { background: var(--play-blue-light); color: var(--play-blue); border-color: #D2E3FC; }
  .stat-pill.stars  { background: var(--play-gold-light); color: #B45309; border-color: #FDE68A; }

  /* Play Store Category Chips Bar */
  .chips-bar {
    max-width: 960px;
    margin: 10px auto 2px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .chips-bar::-webkit-scrollbar { display: none; }

  .play-chip {
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-color);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .play-chip.active {
    background: var(--play-green-light);
    color: var(--play-green-dark);
    border-color: var(--play-green);
  }

  /* Main Container */
  .main-container {
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 14px 92px;
    flex: 1;
  }

  /* Featured Play Store Banner */
  .featured-banner {
    background: linear-gradient(135deg, #01875F 0%, #00695C 60%, #004D40 100%);
    color: #fff;
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
  }

  .featured-tag {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .featured-title {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .featured-desc {
    font-size: 13px;
    opacity: 0.92;
    margin-bottom: 14px;
  }

  /* Play Store Section Header */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 2px 10px;
  }

  .section-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text-primary);
  }

  .section-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
  }

  /* Cards & Grids */
  .play-card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .stations-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 12px;
  }

  .station-app-item {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .station-app-item:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .station-app-item.locked {
    opacity: 0.65;
    background: var(--surface-variant);
    cursor: not-allowed;
  }

  .app-icon-tile {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
  }

  .station-info {
    flex: 1;
    min-width: 0;
  }

  .station-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .station-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 2px 0 6px;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--surface-variant);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--play-green);
    border-radius: var(--radius-pill);
    transition: width 0.3s ease;
  }

  /* Buttons */
  .btn-play {
    border: none;
    border-radius: var(--radius-pill);
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--play-green);
    color: #fff;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .btn-play:hover:not(:disabled) { background: var(--play-green-dark); }
  .btn-play:disabled {
    background: var(--border-color);
    color: var(--text-secondary);
    cursor: not-allowed;
  }

  .btn-outline {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-primary);
  }
  .btn-outline:hover { background: var(--surface-variant); }

  /* Grade Circles Row */
  .grades-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 6px 2px;
    scrollbar-width: none;
  }
  .grade-pill-btn {
    min-width: 72px;
    padding: 10px 8px;
    border-radius: 16px;
    border: 2px solid var(--border-color);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .grade-pill-btn.active {
    border-color: var(--play-green);
    background: var(--play-green-light);
  }

  /* Question & Options */
  .formula-box {
    background: var(--play-green-light);
    border: 2px solid #A8DAB5;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    font-size: 26px;
    font-weight: 900;
    color: var(--play-green-dark);
    margin: 14px 0;
    direction: ltr;
  }

  .option-card {
    width: 100%;
    text-align: right;
    padding: 14px 18px;
    border-radius: 14px;
    border: 2px solid var(--border-color);
    background: var(--surface);
    font-size: 16px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.12s;
  }
  .option-card:hover:not(:disabled) { border-color: var(--play-green); background: #F4FBF7; }
  .option-card.correct { background: #CEEAD6; border-color: var(--play-green); color: #0D652D; }
  .option-card.wrong   { background: var(--play-red-light); border-color: var(--play-red); color: #A50E0E; }
  .option-card:disabled { cursor: default; }

  /* Bottom Navigation (Play Store Style) */
  .play-bottom-nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    background: var(--surface);
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: center;
    z-index: 100;
    padding: 6px 8px;
  }

  .bottom-nav-wrap {
    max-width: 640px;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }

  .nav-tab {
    border: none;
    background: transparent;
    padding: 6px 4px;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
  }
  .nav-tab .nav-pill {
    padding: 3px 16px;
    border-radius: var(--radius-pill);
    font-size: 16px;
    transition: background 0.15s;
  }
  .nav-tab.active {
    color: var(--play-green-dark);
    font-weight: 900;
  }
  .nav-tab.active .nav-pill {
    background: var(--play-green-light);
  }

  pre.code-block {
    background: #1E293B;
    color: #F8FAFC;
    padding: 14px;
    border-radius: 12px;
    font-family: monospace;
    font-size: 12px;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    line-height: 1.5;
    margin-top: 8px;
  }

  #toast-box {
    position: fixed;
    bottom: 78px;
    left: 16px;
    z-index: 300;
  }
  .toast-item {
    background: #202124;
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    margin-top: 6px;
    box-shadow: var(--shadow-md);
  }

  @media print {
    .play-header, .play-bottom-nav, .no-print { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<header class="play-header">

      <div class="play-logo-box">∑</div>
      <div>

</header>

<main class="main-container" id="appView"></main>

<nav class="play-bottom-nav">

    </button>
    <button class="nav-tab" data-tab="GRADES" onclick="switchMainTab('GRADES')">
      <span class="nav-pill">🎒</span>
      <span>الصفوف 1-7</span>
    </button>
    <button class="nav-tab" data-tab="ACHIEVEMENTS" onclick="switchMainTab('ACHIEVEMENTS')">
      <span class="nav-pill">🏆</span>
      <span>الأوسمة</span>
    </button>
    <button class="nav-tab" data-tab="DOCS" onclick="switchMainTab('DOCS')">
      <span class="nav-pill">⚙️</span>
      <span>الإعدادات وAPK</span>
    </button>
  </div>
</nav>

<div id="toast-box"></div>

function fmtNum(val) {
  const str = String(val);
  if (!state.useEasternDigits) return str;
  const eastern = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return str.replace(/[0-9]/g, ch => eastern[ch.charCodeAt(0) - 48]);
}

// ==================== 3. HEARTS REGENERATION (3 ATTEMPTS / 20 MIN) ====================
function checkHeartRegen() {
  if (state.remainingAttempts >= 3) {
    state.remainingAttempts = 3;
    state.lastAttemptLostTimestamp = 0;
    return "";
  }
  const now = Date.now();
  const regenMs = 20 * 60 * 1000;
  const elapsed = now - (state.lastAttemptLostTimestamp || now);
  if (elapsed >= regenMs) {
    const restored = Math.floor(elapsed / regenMs);
    state.remainingAttempts = Math.min(3, state.remainingAttempts + restored);
    state.lastAttemptLostTimestamp = state.remainingAttempts >= 3 ? 0 : state.lastAttemptLostTimestamp + restored * regenMs;
    saveState();
  }
  if (state.remainingAttempts < 3 && state.lastAttemptLostTimestamp > 0) {
    const rem = Math.max(0, regenMs - ((now - state.lastAttemptLostTimestamp) % regenMs));
    const mins = String(Math.floor(rem / 60000)).padStart(2, '0');
    const secs = String(Math.floor((rem % 60000) / 1000)).padStart(2, '0');
    return `${mins}:${secs}`;
  }
  return "";
}

// ==================== 4. DETERMINISTIC DAILY CHALLENGE GENERATOR ====================
function getDailyProblemForDate(dateKey, gradeNum) {
  // Deterministic seed based on dateKey + gradeNum
  let hash = 0;
  const seedStr = `${dateKey}_G${gradeNum}`;
  for (let i = 0; i < seedStr.length; i++) {
    hash = ((hash << 5) - hash) + seedStr.charCodeAt(i);
    hash |= 0;
  }
  const absHash = Math.abs(hash);

  let qText = "", formula = "", correct = "", options = [], explanation = "";
  if (gradeNum === 1) {
    const a = (absHash % 10) + 5;
    const b = ((absHash >> 3) % 5) + 2;
    const ans = a + b;
    qText = "تحدي الصف الأول: ما هو ناتج عملية الجمع الآتية؟";
    formula = `${a} + ${b} = ?`;
    correct = String(ans);
    options = [String(ans), String(ans + 1), String(ans - 1), String(ans + 2)];
    explanation = `نجمع ${a} مع ${b} فيكون الناتج الصحيح ${ans}.`;
  } else if (gradeNum === 2) {
    const a = (absHash % 40) + 25;
    const b = ((absHash >> 2) % 15) + 10;
    const ans = a - b;
    qText = "تحدي الصف الثاني: احسب ناتج عملية الطرح الذهني:";
    formula = `${a} - ${b} = ?`;
    correct = String(ans);
    options = [String(ans), String(ans + 10), String(ans - 2), String(ans + 3)];
    explanation = `بطرح الآحاد والعشرات: ${a} - ${b} = ${ans}.`;
  } else if (gradeNum === 3) {
    const a = (absHash % 7) + 3;
    const b = ((absHash >> 3) % 7) + 3;
    const ans = a * b;
    qText = "تحدي الصف الثالث: كم يساوي حاصل الضرب؟";
    formula = `${a} × ${b} = ?`;
    correct = String(ans);
    options = [String(ans), String(ans + a), String(ans - b), String(ans + 4)];
    explanation = `من جدول الضرب: ${a} × ${b} = ${ans}.`;
  } else if (gradeNum === 4) {
    const a = (absHash % 15) + 12;
    const b = ((absHash >> 2) % 5) + 4;
    const ans = a * b;
    qText = "تحدي الصف الرابع: أوجد حاصل الضرب بدقة:";
    formula = `${a} × ${b} = ?`;
    correct = String(ans);
    options = [String(ans), String(ans + 10), String(ans - 10), String(ans + 2)];
    explanation = `نضرب الآحاد ثم العشرات: ${a} × ${b} = ${ans}.`;
  } else if (gradeNum === 5) {
    const den = 7;
    const n1 = (absHash % 3) + 1;
    const n2 = ((absHash >> 2) % 2) + 2;
    const sum = n1 + n2;
    qText = "تحدي الصف الخامس: اجمع الكسرين المتشابهين في المقام:";
    formula = `${n1}/${den} + ${n2}/${den} = ?`;
    correct = `${sum}/${den}`;
    options = [`${sum}/${den}`, `${sum + 1}/${den}`, `${sum}/${den * 2}`, `1/${den}`];
    explanation = `المقام موحد (${den})، نجمع البسطين: ${n1} + ${n2} = ${sum}/${den}.`;
  } else if (gradeNum === 6) {
    const a = (absHash % 6) + 4;
    const b = ((absHash >> 2) % 5) + 3;
    const c = ((absHash >> 4) % 4) + 2;
    const ans = a + (b * c);
    qText = "تحدي الصف السادس: راعِ أولويات العمليات الحسابية:";
    formula = `${a} + ${b} × ${c} = ?`;
    correct = String(ans);
    options = [String(ans), String((a + b) * c), String(ans + 4), String(ans - 3)];
    explanation = `الأولوية للضرب أولاً (${b} × ${c} = ${b * c}) ثم نجمع ${a} فيكون الناتج ${ans}.`;
  } else {
    const x = (absHash % 8) + 3;
    const coeff = ((absHash >> 2) % 4) + 2;
    const k = ((absHash >> 4) % 7) + 2;
    const total = coeff * x + k;
    qText = "تحدي الصف السابع: أوجد قيمة المجهول (س) في المعادلة:";
    formula = `${coeff} س + ${k} = ${total}`;
    correct = String(x);
    options = [String(x), String(x + 1), String(x - 1), String(x + 3)];
    explanation = `نطرح ${k} من الطرفين (${coeff} س = ${total - k}) ثم نقسم على ${coeff} فتكون س = ${x}.`;
  }

  // Deterministic shuffle of options
  const rotated = options.map((opt, idx) => ({ opt, sortKey: (absHash + idx * 31) % 101 }))
                         .sort((a, b) => a.sortKey - b.sortKey)
                         .map(x => x.opt);

  return { dateKey, gradeNum, qText, formula, correct, options: rotated, explanation };
}

// ==================== 5. DYNAMIC LEVEL QUESTION GENERATOR ====================
function generateQuestionsForLevel(levelId) {
  const list = [];
  for (let i = 0; i < 5; i++) {
    const seed = levelId * 100 + i + Math.floor(Math.random() * 50);
    let qText = "", formula = "", correct = "", opts = [], hint = "";

    if (levelId <= 5) {
      const a = Math.floor(Math.random() * 40) + 10;
      const b = Math.floor(Math.random() * 40) + 10;
      if (levelId === 1) {
        correct = a > b ? ">" : (a < b ? "<" : "=");
        qText = "اختر الإشارة المناسبة للمقارنة بين العددين:";
        formula = `${a} [ ? ] ${b}`;
        opts = [">", "<", "=", "+"];
        hint = `قارن بين ${a} و ${b}: الإشارة الصحيحة هي ${correct}`;
      } else {
        const tens = Math.floor(a / 10) * 10;
        correct = String(tens);
        qText = `ما القيمة المكانية لرقم العشرات في العدد ${a}؟`;
        formula = `${a}`;
        opts = [String(tens), String(Math.floor(a / 10)), String(a % 10), String(tens + 10)];
        hint = `رقم العشرات في ${a} قيمته المكانية هي ${tens}.`;
      }
    } else if (levelId <= 10) {
      const a = Math.floor(Math.random() * 45) + 18;
      const b = Math.floor(Math.random() * 25) + 12;
      const isAdd = (i % 2 === 0);
      const ans = isAdd ? a + b : a - b;
      correct = String(ans);
      qText = isAdd ? "أوجد ناتج عملية الجمع الآتية:" : "أوجد ناتج عملية الطرح الآتية:";
      formula = `${a} ${isAdd ? '+' : '-'} ${b} = ?`;
      opts = [String(ans), String(ans + 10), String(ans - 1), String(ans + 2)];
      hint = `احسب الآحاد ثم العشرات: النتيجة هي ${ans}.`;
    } else if (levelId <= 15) {
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 8) + 3;
      const prod = a * b;
      if (levelId === 13 || levelId === 15) {
        correct = String(a);
        qText = "أوجد خارج القسمة الصحيح:";
        formula = `${prod} ÷ ${b} = ?`;
        opts = [String(a), String(a + 1), String(Math.max(1, a - 1)), String(a + 2)];
        hint = `لأن ${a} × ${b} = ${prod} فإن ${prod} ÷ ${b} = ${a}.`;
      } else {
        correct = String(prod);
        qText = "أوجد حاصل الضرب السريع:";
        formula = `${a} × ${b} = ?`;
        opts = [String(prod), String(prod + a), String(prod - b), String(prod + 3)];
        hint = `من جدول الضرب: ${a} × ${b} = ${prod}.`;
      }
    } else if (levelId <= 20) {
      const den = [5, 7, 8, 9][i % 4];
      const n1 = 1 + (i % 3);
      const n2 = 2;
      const sum = n1 + n2;
      correct = `${sum}/${den}`;
      qText = "اجمع الكسرين ذوي المقام الموحد:";
      formula = `${n1}/${den} + ${n2}/${den} = ?`;
      opts = [`${sum}/${den}`, `${sum + 1}/${den}`, `${sum}/${den * 2}`, `${n1}/${den}`];
      hint = `المقام موحد (${den})، نجمع البسطين: ${n1} + ${n2} = ${sum}/${den}.`;
    } else if (levelId <= 25) {
      const a = Math.floor(Math.random() * 6) + 3;
      const b = Math.floor(Math.random() * 5) + 2;
      const c = Math.floor(Math.random() * 4) + 2;
      const ans = a + b * c;
      correct = String(ans);
      qText = "احسب قيمة المقدار بمراعاة أولويات العمليات:";
      formula = `${a} + ${b} × ${c} = ?`;
      opts = [String(ans), String((a + b) * c), String(ans + 3), String(ans - 2)];
      hint = `الضرب يسبق الجمع: ${b} × ${c} = ${b * c}، ثم نضيف ${a} = ${ans}.`;
    } else if (levelId <= 30) {
      const side = Math.floor(Math.random() * 7) + 4;
      const area = side * side;
      correct = `${area} سم²`;
      qText = `مربع طول ضلعه ${side} سم، ما مساحته؟`;
      formula = `${side} × ${side} = ?`;
      opts = [`${area} سم²`, `${side * 4} سم²`, `${area + 4} سم²`, `${area - 2} سم²`];
      hint = `مساحة المربع = الضلع × نفسه = ${side} × ${side} = ${area} سم².`;
    } else {
      const x = Math.floor(Math.random() * 9) + 3;
      const k = Math.floor(Math.random() * 8) + 4;
      const total = x + k;
      correct = String(x);
      qText = "حل المعادلة الجبرية لإيجاد قيمة (س):";
      formula = `س + ${k} = ${total}`;
      opts = [String(x), String(x + 2), String(x - 1), String(total + k)];
      hint = `نطرح ${k} من الطرفين: س = ${total} - ${k} = ${x}.`;
    }

    const uniqueOpts = Array.from(new Set([correct, ...opts]));
    while (uniqueOpts.length < 4) uniqueOpts.push(String(Math.floor(Math.random() * 50) + 51));
    const shuffled = uniqueOpts.slice(0, 4).sort(() => Math.random() - 0.5);
    list.push({ qText, formula, correct, options: shuffled, hint });
  }
  return list;
}

        <div class="section-title">🗺️ محطات المغامرة التعليمية (${fmtNum(filteredStations.length)})</div>
        <div class="section-subtitle">تصميم سريع ومباشر بدون شاشات وسيطة</div>
      </div>
    </div>

    <div class="stations-grid">
      ${filteredStations.map((st, idx) => {
        const stLevels = LEVELS.filter(l => l.stationId === st.id);
        const isUnlocked = st.id === 1 || stLevels.some(l => state.unlockedLevels.includes(l.levelId));
        const completedCount = stLevels.filter(l => state.completedLevels[l.levelId]).length;
        const starsEarned = stLevels.reduce((acc, l) => acc + (state.completedLevels[l.levelId]?.stars || 0), 0);
        const pct = Math.round((completedCount / stLevels.length) * 100);

        return `
          <div class="station-app-item ${isUnlocked ? '' : 'locked'}" onclick="${isUnlocked ? `openStation(${st.id})` : `showToast('أكمل المحطة السابقة لفتح هذه المحطة 🔒')`}">
            <div class="app-icon-tile" style="background:${isUnlocked ? st.color : '#9AA0A6'};">
              ${isUnlocked ? st.icon : '🔒'}
            </div>
            <div class="station-info">
              <div class="station-name">${st.title}</div>
              <div class="station-meta">${st.grades} • ⭐ ${fmtNum(starsEarned)}/15</div>
              <div class="progress-track">
                <div class="progress-fill" style="width:${pct}%;background:${st.color};"></div>
              </div>
            </div>
            <button class="btn-play" ${isUnlocked ? '' : 'disabled'}>
              ${isUnlocked ? 'العب' : 'مغلق'}
            </button>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function openStation(stationId) {
  activeStationId = stationId;
  renderApp();
}

function renderStationLevels(stationId) {
  const st = STATIONS.find(s => s.id === stationId);
  const stLevels = LEVELS.filter(l => l.stationId === stationId);

  return `
    <div class="play-card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn-outline" onclick="activeStationId=null; renderApp();">➡️ رجوع</button>
        <div>
          <div style="font-size:17px;font-weight:900;">${st.icon} ${st.title}</div>
          <div style="font-size:12px;color:var(--text-secondary);">${st.subtitle} (${st.grades})</div>
        </div>
      </div>
    </div>

    ${stLevels.map((lvl, idx) => {
      const isUnlocked = state.unlockedLevels.includes(lvl.levelId) || lvl.levelId === 1;
      const rec = state.completedLevels[lvl.levelId];
      const stars = rec ? rec.stars : 0;
      return `
        <div class="play-card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;opacity:${isUnlocked ? '1' : '0.6'};">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="app-icon-tile" style="width:48px;height:48px;font-size:18px;font-weight:900;background:${isUnlocked ? st.color : '#9AA0A6'};">
              ${isUnlocked ? fmtNum(idx + 1) : '🔒'}
            </div>
            <div>
              <div style="font-size:15px;font-weight:800;">${lvl.title}</div>
              <div style="font-size:12px;color:var(--text-secondary);">${lvl.skill}</div>
              <div style="font-size:13px;margin-top:4px;color:#F59E0B;">
                ${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}
              </div>
            </div>
          </div>
          <button class="btn-play" ${isUnlocked ? '' : 'disabled'} onclick="startLevelChallenge(${lvl.levelId})">
            ${isUnlocked ? 'ابدأ التحدي ▶' : 'مغلق'}
          </button>
        </div>
      `;
    }).join('')}
  `;
}

// ==================== 7. LEVEL CHALLENGE SESSION ====================
function startLevelChallenge(levelId) {
  if (state.remainingAttempts <= 0) {
    showToast("انتهت المحاولات (القلوب)! انتظر تجدد القلوب كل 20 دقيقة ⏳");
    return;
  }
  const lvl = LEVELS.find(l => l.levelId === levelId);
  activeSession = {
    level: lvl,
    questions: generateQuestionsForLevel(levelId),
    currentIndex: 0,
    selectedOpt: null,
    isSubmitted: false,
    isCorrect: false,
    correctCount: 0,
    scoreEarned: 0,
    isCompleted: false
  };
  renderApp();
}

function renderChallengeSession() {
  const s = activeSession;
  if (s.isCompleted) {
    const accuracy = Math.round((s.correctCount / s.questions.length) * 100);
    const stars = accuracy === 100 ? 3 : (accuracy >= 80 ? 2 : (accuracy >= 60 ? 1 : 0));
    return `
      <div class="play-card" style="text-align:center;padding:28px 18px;">
        <div style="font-size:46px;margin-bottom:8px;">${stars >= 2 ? '🏆' : '🌟'}</div>
        <div style="font-size:20px;font-weight:900;color:var(--play-green-dark);">
          ${stars >= 2 ? 'أحسنت! اجتزت المستوى بنجاح' : 'محاولة جيدة! حاول مجدداً لتحصل على نجمتين على الأقل'}
        </div>
        <div style="font-size:28px;margin:12px 0;">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
        <div style="font-size:14px;color:var(--text-secondary);margin-bottom:18px;">
          الإجابات الصحيحة: <b>${fmtNum(s.correctCount)} من ${fmtNum(s.questions.length)}</b> • النقاط المكتسبة: <b>+${fmtNum(s.scoreEarned)}</b>
        </div>
        <div style="display:flex;justify-content:center;gap:10px;">
          <button class="btn-outline" onclick="startLevelChallenge(${s.level.levelId})">🔄 إعادة المستوى</button>
          <button class="btn-play" onclick="activeSession=null; renderApp();">🗺️ متابعة المحطة</button>
        </div>
      </div>
    `;
  }

  const q = s.questions[s.currentIndex];
  const progressPct = Math.round(((s.currentIndex + 1) / s.questions.length) * 100);

  return `
    <div class="play-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <button class="btn-outline" onclick="activeSession=null; renderApp();">✖ إنهاء</button>
        <div style="font-weight:800;font-size:14px;">${s.level.title} • سؤال ${fmtNum(s.currentIndex + 1)}/${fmtNum(s.questions.length)}</div>
        <div style="font-weight:800;color:var(--play-red);">❤️ ${fmtNum(state.remainingAttempts)}/3</div>
      </div>
      <div class="progress-track" style="margin-bottom:16px;">
        <div class="progress-fill" style="width:${progressPct}%;"></div>
      </div>

      <div style="font-size:17px;font-weight:800;text-align:center;margin-bottom:10px;">${q.qText}</div>
      <div class="formula-box">${fmtNum(q.formula)}</div>

      <div style="margin-top:14px;">
        ${q.options.map(opt => {
          let cls = "option-card";
          if (s.isSubmitted) {
            if (opt === q.correct) cls += " correct";
            else if (opt === s.selectedOpt) cls += " wrong";
          }
          return `
            <button class="${cls}" ${s.isSubmitted ? 'disabled' : ''} onclick="submitChallengeOption('${opt.replace(/'/g, "\\'")}')">
              <span>${fmtNum(opt)}</span>
              <span>${s.isSubmitted && opt === q.correct ? '✅' : (s.isSubmitted && opt === s.selectedOpt ? '✖' : '')}</span>
            </button>
          `;
        }).join('')}
      </div>

      ${s.isSubmitted ? `
        <div style="background:var(--play-blue-light);border-radius:12px;padding:12px;margin-top:10px;font-size:13px;color:var(--play-blue);font-weight:700;">
          💡 ${q.hint}
        </div>
        <button class="btn-play" style="width:100%;margin-top:12px;padding:12px;" onclick="nextChallengeQuestion()">
          السؤال التالي ⬅️
        </button>
      ` : ''}
    </div>
  `;
}

function submitChallengeOption(opt) {
  const s = activeSession;
  if (!s || s.isSubmitted) return;
  const q = s.questions[s.currentIndex];
  s.selectedOpt = opt;
  s.isSubmitted = true;
  s.isCorrect = (opt === q.correct);

  if (s.isCorrect) {
    s.correctCount++;
    s.scoreEarned += 15;
  } else {
    state.remainingAttempts = Math.max(0, state.remainingAttempts - 1);
    if (state.lastAttemptLostTimestamp === 0) state.lastAttemptLostTimestamp = Date.now();
    saveState();
  }
  renderApp();
}

function nextChallengeQuestion() {
  const s = activeSession;
  if (!s) return;
  if (state.remainingAttempts <= 0) {
    showToast("انتهت القلوب المتاحة! انتظر تجدد المحاولات ⏳");
    activeSession = null;
    renderApp();
    return;
  }
  if (s.currentIndex + 1 < s.questions.length) {
    s.currentIndex++;
    s.selectedOpt = null;
    s.isSubmitted = false;
    s.isCorrect = false;
  } else {
    s.isCompleted = true;
    const accuracy = Math.round((s.correctCount / s.questions.length) * 100);
    const stars = accuracy === 100 ? 3 : (accuracy >= 80 ? 2 : (accuracy >= 60 ? 1 : 0));
    const prev = state.completedLevels[s.level.levelId] || { stars: 0, bestScore: 0 };
    const starsDelta = Math.max(0, stars - prev.stars);
    state.totalScore += s.scoreEarned;
    state.totalStars += starsDelta;
    state.completedLevels[s.level.levelId] = {
      stars: Math.max(prev.stars, stars),
      bestScore: Math.max(prev.bestScore, s.scoreEarned),
      accuracy
    };
    if (accuracy >= 80 && s.level.levelId < 35 && !state.unlockedLevels.includes(s.level.levelId + 1)) {
      state.unlockedLevels.push(s.level.levelId + 1);
    }
    checkAchievementsUnlock(s.level.levelId, stars, accuracy);
    saveState();
  }
  renderApp();
}

function checkAchievementsUnlock(levelId, stars, accuracy) {
  const unlock = (id) => { if (!state.unlockedAchievements.includes(id)) state.unlockedAchievements.push(id); };
  if (levelId === 1 && accuracy >= 80) unlock("first_step");
  if (stars === 3) unlock("perfect_stars");
  if (levelId === 10 && accuracy >= 80) unlock("addition_master");
  if (levelId === 15 && accuracy >= 80) unlock("multiplication_hero");
  if (levelId === 20 && accuracy >= 80) unlock("fractions_wizard");
  if (levelId === 25 && accuracy >= 80) unlock("puzzle_master");
  if (Object.keys(state.completedLevels).length >= 35) unlock("crown_genius");
}

// ==================== 8. DAILY CHALLENGE TAB (STRICT ONCE-PER-DAY GLOBAL LOCK) ====================
function renderDailyChallengeTab() {
  const todayKey = getTodayKey();
  const isCompletedToday = (state.dailyChallenge.lastCompletedDateKey === todayKey);

  // If completed today, always lock to the grade in which today's challenge was answered!
  const displayGradeNum = isCompletedToday && state.dailyChallenge.lockedGradeNumber
    ? state.dailyChallenge.lockedGradeNumber
    : state.selectedGrade;

  const gradeObj = GRADES_INFO.find(g => g.num === displayGradeNum) || GRADES_INFO[0];
  const problem = getDailyProblemForDate(todayKey, displayGradeNum);

  return `
    <div class="play-card" style="border-color:var(--play-green);background:var(--play-green-light);">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div>
          <div style="font-size:17px;font-weight:900;color:var(--play-green-dark);">🌟 تحدي اليوم الموحد (${todayKey})</div>
          <div style="font-size:12px;color:var(--text-secondary);font-weight:700;">
            متاح مرة واحدة فقط كل يوم لجميع الصفوف • المكافأة: +50 نقطة و 3 نجوم
          </div>
        </div>
        <span class="stat-pill stars">🔥 سلسلة الإنجاز: ${fmtNum(state.dailyChallenge.streakDays)} أيام</span>
      </div>
    </div>

    ${isCompletedToday ? `
      <div class="play-card" style="background:#FEF3C7;border-color:#F59E0B;">
        <div style="font-weight:900;color:#92400E;font-size:14px;">
          🔒 تم إنجاز تحدي اليوم (${todayKey}) في (${gradeObj.name})
        </div>
        <div style="font-size:12px;color:#B45309;margin-top:4px;">
          لتطبيق قواعد اللعب العادل، لا يمكن إعادة تفعيل تحدي اليوم أو تكرار النقاط بتغيير الصف الدراسي، وسيتجدد التحدي تلقائياً غداً إن شاء الله.
        </div>
      </div>
    ` : ''}

    <div class="play-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span style="font-weight:800;font-size:13px;color:var(--play-green);">${gradeObj.icon} ${gradeObj.name}</span>
        ${!isCompletedToday ? `<button class="btn-outline" style="padding:4px 12px;font-size:12px;" onclick="switchMainTab('GRADES')">تغيير الصف 🎒</button>` : ''}
      </div>

      <div style="font-size:17px;font-weight:800;margin-bottom:10px;">${problem.qText}</div>
      <div class="formula-box">${fmtNum(problem.formula)}</div>

      <div style="font-size:13px;font-weight:800;color:var(--text-secondary);margin-bottom:10px;">
        ${isCompletedToday ? 'إجابتك المسجلة لليوم:' : 'اختر الإجابة الصحيحة (تُقفل المحاولة بعد الاختيار لليوم):'}
      </div>

      ${problem.options.map(opt => {
        let cls = "option-card";
        if (isCompletedToday) {
          if (opt === problem.correct) cls += " correct";
          else if (opt === state.dailyChallenge.selectedOption) cls += " wrong";
        }
        return `
          <button class="${cls}" ${isCompletedToday ? 'disabled' : ''} onclick="submitDailyAnswerOnce('${opt.replace(/'/g, "\\'")}')">
            <span>${fmtNum(opt)}</span>
            <span>${isCompletedToday && opt === problem.correct ? '✅ الإجابة الصحيحة' : (isCompletedToday && opt === state.dailyChallenge.selectedOption ? '✖ اختيارك' : '')}</span>
          </button>
        `;
      }).join('')}

      ${isCompletedToday ? `
        <div style="margin-top:12px;padding:12px;border-radius:12px;background:var(--play-blue-light);color:var(--play-blue);font-size:13px;font-weight:700;">
          💡 الشرح: ${problem.explanation}
        </div>
      ` : ''}
    </div>
  `;
}

function submitDailyAnswerOnce(selectedOpt) {
  const todayKey = getTodayKey();
  // STRICT GUARD: Never allow answering or adding points if already completed today!
  if (state.dailyChallenge.lastCompletedDateKey === todayKey) {
    showToast("تم إنجاز تحدي اليوم مسبقاً! يتجدد غداً 🔒");
    return;
  }

  const problem = getDailyProblemForDate(todayKey, state.selectedGrade);
  const isCorrect = (selectedOpt === problem.correct);

  // Lock globally for today across ALL grades
  state.dailyChallenge.lastCompletedDateKey = todayKey;
  state.dailyChallenge.lockedGradeNumber = state.selectedGrade;
  state.dailyChallenge.selectedOption = selectedOpt;
  state.dailyChallenge.wasCorrect = isCorrect;

  if (isCorrect) {
    state.dailyChallenge.streakDays = (state.dailyChallenge.streakDays || 0) + 1;
    state.totalScore += 50;
    state.totalStars += 3;
    showToast("ممتاز! إجابة صحيحة وحصلت على +50 نقطة و 3 نجوم 🌟");
  } else {
    showToast(`حظاً أوفر غداً! الإجابة الصحيحة هي: ${problem.correct}`);
  }

  saveState();
  renderApp();
}

// ==================== 9. GRADES & ACHIEVEMENTS TABS ====================

}

function renderDocsAndSettingsTab() {

    <div class="play-card">
      <div style="font-size:16px;font-weight:900;margin-bottom:10px;color:var(--play-green-dark);">⚙️ إعدادات اللاعب والبطاقة التقديرية</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">

        <li><b>حذف "شرح وتدريب المهارة":</b> تم حذف شاشة الشرح (`TutorialScreen`) وأزرارها، ليبدأ التحدي مباشرةً وبسرعة.</li>
        <li><b>حذف "المختبر التفاعلي وحقل الإدخال":</b> تم حذف شاشة المختبر التفاعلي (`InteractiveMathPracticeScreen`) وحقول الإدخال النصية بالكامل.</li>
