name: Build Android APK (Math Genius PlayStore v2)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 4. Prepare Android Project from index.html
        run: |
          rm -rf app build settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/aistudio/mathgenius
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          if [ -f "index.html" ]; then
            cp "index.html" app/src/main/assets/index.html
          else
            FIRST_HTML=$(ls *.html 2>/dev/null | head -n 1 || true)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" app/src/main/assets/index.html
            else
              echo "ERROR: index.html not found!"
              exit 1
            fi
          fi

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            'rootProject.name = "MathGeniusPlayStore"' \
            'include ":app"' \
            > settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.5.2" apply false' \
            '}' \
            > build.gradle

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '}' \
            'android {' \
            '    namespace "com.aistudio.mathgenius"' \
            '    compileSdk 34' \
            '    defaultConfig {' \
            '        applicationId "com.aistudio.mathgenius.kdzmql"' \
            '        minSdk 24' \
            '        targetSdk 34' \
            '        versionCode 2' \
            '        versionName "2.0"' \
            '    }' \
            '    buildTypes {' \
            '        debug {' \
            '            minifyEnabled false' \
            '        }' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '}' \
            'dependencies {' \
            '}' \
            > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:width="108dp"' \
            '    android:height="108dp"' \
            '    android:viewportWidth="108"' \
            '    android:viewportHeight="108">' \
            '    <path android:fillColor="#01875F" android:pathData="M0,0h108v108h-108z"/>' \
            '</vector>' \
            > app/src/main/res/drawable/ic_launcher_background.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:width="108dp"' \
            '    android:height="108dp"' \
            '    android:viewportWidth="108"' \
            '    android:viewportHeight="108">' \
            '    <path android:fillColor="#FFFFFF" android:pathData="M30,24 L78,24 A10,10 0 0 1 88,34 L88,74 A10,10 0 0 1 78,84 L30,84 A10,10 0 0 1 20,74 L20,34 A10,10 0 0 1 30,24 Z"/>' \
            '    <path android:fillColor="#01875F" android:pathData="M36,40 h8 v-8 h6 v8 h8 v6 h-8 v8 h-6 v-8 h-8 z"/>' \
            '    <path android:fillColor="#F59E0B" android:pathData="M56,64 h18 v6 h-18 z"/>' \
            '</vector>' \
            > app/src/main/res/drawable/ic_launcher_foreground.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@drawable/ic_launcher_background"/>' \
            '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
            '</adaptive-icon>' \
            > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <application' \
            '        android:allowBackup="true"' \
            '        android:icon="@mipmap/ic_launcher"' \
            '        android:roundIcon="@mipmap/ic_launcher"' \
            '        android:label="بطل في الرياضيات"' \
            '        android:supportsRtl="true"' \
            '        android:hardwareAccelerated="true"' \
            '        android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:exported="true"' \
            '            android:configChanges="orientation|screenSize|keyboardHidden">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' \
            > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            'package com.aistudio.mathgenius;' \
            'import android.annotation.SuppressLint;' \
            'import android.app.Activity;' \
            'import android.os.Bundle;' \
            'import android.webkit.WebSettings;' \
            'import android.webkit.WebView;' \
            'import android.webkit.WebViewClient;' \
            'public class MainActivity extends Activity {' \
            '    private WebView webView;' \
            '    @SuppressLint("SetJavaScriptEnabled")' \
            '    @Override' \
            '    protected void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        webView = new WebView(this);' \
            '        WebSettings s = webView.getSettings();' \
            '        s.setJavaScriptEnabled(true);' \
            '        s.setDomStorageEnabled(true);' \
            '        s.setDatabaseEnabled(true);' \
            '        s.setAllowFileAccess(true);' \
            '        webView.setWebViewClient(new WebViewClient());' \
            '        webView.loadUrl("file:///android_asset/index.html");' \
            '        setContentView(webView);' \
            '    }' \
            '    @Override' \
            '    public void onBackPressed() {' \
            '        if (webView != null && webView.canGoBack()) webView.goBack();' \
            '        else super.onBackPressed();' \
            '    }' \
            '}' \
            > app/src/main/java/com/aistudio/mathgenius/MainActivity.java

      - name: 5. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MathGenius-PlayStore-v2.apk

      - name: 7. Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathGenius-PlayStore-v2-APK
          path: app/build/outputs/apk/debug/MathGenius-PlayStore-v2.apk
