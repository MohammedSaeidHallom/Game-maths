name: Build Android APK (Math Genius PlayStore v2)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Accept Android SDK Licenses (Built-in SDK)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 4. Prepare or Generate Android Project from index.html
        run: |
          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "Generating standalone Android WebView project from HTML..."
            mkdir -p app/src/main/assets
            mkdir -p app/src/main/java/com/aistudio/mathgenius
            mkdir -p app/src/main/res/values

            if [ -f "index.html" ]; then
              cp "index.html" app/src/main/assets/index.html
            else
              FIRST_HTML=$(ls *.html 2>/dev/null | head -n 1 || true)
              if [ -n "$FIRST_HTML" ]; then
                cp "$FIRST_HTML" app/src/main/assets/index.html
              else
                echo "ERROR: Please upload index.html to the repository root!"
                exit 1
              fi
            fi

            printf '%s\n' \
              'rootProject.name = "MathGeniusPlayStore"' \
              'include ":app"' \
              > settings.gradle

            printf '%s\n' \
              'buildscript {' \
              '    repositories { google(); mavenCentral() }' \
              '    dependencies { classpath "com.android.tools.build:gradle:8.2.2" }' \
              '}' \
              'allprojects {' \
              '    repositories { google(); mavenCentral() }' \
              '}' \
              > build.gradle

            printf '%s\n' \
              'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
              'android.useAndroidX=true' \
              > gradle.properties

            printf '%s\n' \
              'apply plugin: "com.android.application"' \
              'android {' \
              '    namespace "com.aistudio.mathgenius"' \
              '    compileSdk 34' \
              '    defaultConfig {' \
              '        applicationId "com.aistudio.mathgenius.kdzmql"' \
              '        minSdk 24' \
              '        targetSdk 34' \
              '        versionCode 2' \
              '        versionName "2.0"' \
              '    }' \
              '    buildTypes {' \
              '        debug {' \
              '            minifyEnabled false' \
              '        }' \
              '    }' \
              '    compileOptions {' \
              '        sourceCompatibility JavaVersion.VERSION_17' \
              '        targetCompatibility JavaVersion.VERSION_17' \
              '    }' \
              '}' \
              'dependencies {' \
              '    implementation "androidx.appcompat:appcompat:1.6.1"' \
              '}' \
              > app/build.gradle

            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <application' \
              '        android:allowBackup="true"' \
              '        android:label="بطل في الرياضيات"' \
              '        android:supportsRtl="true"' \
              '        android:hardwareAccelerated="true"' \
              '        android:theme="@style/Theme.AppCompat.Light.NoActionBar">' \
              '        <activity' \
              '            android:name=".MainActivity"' \
              '            android:exported="true"' \
              '            android:configChanges="orientation|screenSize|keyboardHidden">' \
              '            <intent-filter>' \
              '                <action android:name="android.intent.action.MAIN" />' \
              '                <category android:name="android.intent.category.LAUNCHER" />' \
              '            </intent-filter>' \
              '        </activity>' \
              '    </application>' \
              '</manifest>' \
              > app/src/main/AndroidManifest.xml

            printf '%s\n' \
              'package com.aistudio.mathgenius;' \
              'import android.annotation.SuppressLint;' \
              'import android.os.Bundle;' \
              'import android.webkit.WebSettings;' \
              'import android.webkit.WebView;' \
              'import android.webkit.WebViewClient;' \
              'import androidx.appcompat.app.AppCompatActivity;' \
              'public class MainActivity extends AppCompatActivity {' \
              '    private WebView webView;' \
              '    @SuppressLint("SetJavaScriptEnabled")' \
              '    @Override' \
              '    protected void onCreate(Bundle savedInstanceState) {' \
              '        super.onCreate(savedInstanceState);' \
              '        webView = new WebView(this);' \
              '        WebSettings s = webView.getSettings();' \
              '        s.setJavaScriptEnabled(true);' \
              '        s.setDomStorageEnabled(true);' \
              '        s.setDatabaseEnabled(true);' \
              '        s.setAllowFileAccess(true);' \
              '        webView.setWebViewClient(new WebViewClient());' \
              '        webView.loadUrl("file:///android_asset/index.html");' \
              '        setContentView(webView);' \
              '    }' \
              '    @Override' \
              '    public void onBackPressed() {' \
              '        if (webView != null && webView.canGoBack()) webView.goBack();' \
              '        else super.onBackPressed();' \
              '    }' \
              '}' \
              > app/src/main/java/com/aistudio/mathgenius/MainActivity.java
          fi

      - name: 5. Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 6. Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MathGenius-PlayStore-v2.apk

      - name: 7. Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathGenius-PlayStore-v2-APK
          path: app/build/outputs/apk/debug/MathGenius-PlayStore-v2.apk
